apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netdrift.fullname" . }}-scheduler
  labels:
    {{- include "netdrift.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "netdrift.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "netdrift.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: {{ include "netdrift.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - netdrift.scheduler
            - --interval
            - {{ .Values.scheduler.interval | quote }}
          ports:
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
          envFrom:
            - secretRef:
                name: {{ include "netdrift.fullname" . }}
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              # Detects container crashes and OOM kills. Does not detect a
              # deadlocked APScheduler thread — for that, add a heartbeat file
              # write to scheduler.py and check its mtime here instead.
              command: ["python", "-c", "import netdrift.scheduler"]
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          {{- if .Values.devicesYaml }}
          volumeMounts:
            - name: devices
              mountPath: /usr/local/lib/python3.11/devices.yml
              subPath: devices.yml
              readOnly: true
          {{- end }}
      {{- if .Values.devicesYaml }}
      volumes:
        - name: devices
          secret:
            secretName: {{ include "netdrift.fullname" . }}-devices
      {{- end }}
