# Default values for netdrift.
# Override these at install time:
#   helm install netdrift ./helm/netdrift -f my-values.yaml

image:
  repository: ghcr.io/liamseanrose/network-drift-detection-tool
  # Defaults to the chart's appVersion when blank.
  tag: ""
  pullPolicy: IfNotPresent

# -- API server
api:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Scheduler / worker
scheduler:
  # Minutes between scheduled drift polls.
  interval: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      # Higher than the API: the scheduler opens NAPALM/gNMI connections and
      # runs the diff + auto-apply loop for every device on each poll cycle.
      memory: 512Mi

# -- Optional Ingress for the API
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: netdrift.local
  # TLS is required for any internet-facing deployment. Set enabled=true and
  # provide a secretName pointing to a TLS Secret (e.g. from cert-manager).
  # Do not expose the API over plain HTTP on an untrusted network.
  tls:
    enabled: false
    secretName: ""

# -- NetBox connection details (required)
netbox:
  url: ""
  token: ""

# -- Device inventory — paste the full contents of your devices.yml here.
# Stored as a Kubernetes Secret and mounted read-only into the containers.
# Example:
#   devicesYaml: |
#     core-sw-01:
#       hostname: 192.168.1.10
#       platform: arista_eos
#       username: admin
#       password: secret
devicesYaml: ""

# -- Bitnami PostgreSQL subchart values.
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  auth:
    database: netdrift
    username: netdrift
    # No default password. You MUST set this at install time, e.g.
    #   helm install netdrift ./helm/netdrift --set postgresql.auth.password=<strong>
    # The chart fails to render if it is left empty (see _helpers.tpl).
    password: ""
  primary:
    persistence:
      size: 5Gi
