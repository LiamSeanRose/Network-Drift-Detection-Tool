name: Release

# Build and publish the container image to GHCR when a version tag is pushed.
# The Helm chart (helm/netdrift/values.yaml) points image.repository at
# ghcr.io/<owner>/network-drift-detection-tool; without this workflow nothing
# ever pushes there, so a fresh `helm install` pulls a tag that does not exist.
# Tag a release with `git tag v3.0.1 && git push origin v3.0.1` to trigger it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lower-cases the image name, so a mixed-case owner
          # still produces a valid GHCR reference.
          images: ghcr.io/${{ github.repository_owner }}/network-drift-detection-tool
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile is lower-cased (`dockerfile`); say so explicitly since
          # the default lookup is `Dockerfile` and the runner is case-sensitive.
          file: dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
